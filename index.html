<!DOCTYPE html>
<html lang="kk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Әтеш пен тотықұс</title>
<style>
*{box-sizing:border-box;margin:0;font-family:"Nunito","Trebuchet MS",Arial,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;background:#2d5a27;overflow:hidden}
#app{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center;overflow:hidden;background:#8fd36b;border-radius:16px}
.scr{position:absolute;inset:0;background-size:cover;background-position:center}
#bar{position:absolute;top:0;left:0;right:0;height:76px;display:flex;align-items:center;gap:12px;padding:0 18px;z-index:20}
.btn{border:0;border-radius:40px;padding:12px 26px;font-size:24px;font-weight:800;color:#fff;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.25);transition:transform .15s}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.btn:disabled{filter:grayscale(.9);opacity:.55;cursor:default}
.o{background:linear-gradient(#ff9a3c,#f2600c)}.g{background:linear-gradient(#4cd137,#1e9a1e)}.b{background:linear-gradient(#4aa8ff,#2a62d8)}.pu{background:linear-gradient(#a06bff,#6a35d6)}.rd{background:linear-gradient(#ff7a7a,#d83030)}
.pill{background:#fff;border-radius:30px;padding:8px 20px;font-size:24px;font-weight:800;color:#c45a00;border:3px solid #f5b041;white-space:nowrap}
.prog{flex:1;height:24px;background:#fff8;border-radius:12px;overflow:hidden;border:3px solid #fff}
.prog i{display:block;height:100%;width:0;background:linear-gradient(#ffd93b,#ff9a00);transition:width .5s}
.sign{background:linear-gradient(#c68a4a,#9a6430);border:6px solid #6e4420;border-radius:22px;color:#fff;text-align:center;box-shadow:0 8px 0 #4a2c10,0 12px 20px #0005;padding:10px 28px;font-weight:800;text-shadow:0 2px 2px #0006}
.panel{position:absolute;left:190px;right:190px;top:92px;bottom:28px;background:#fff8e4;border:5px solid #f0b66a;border-radius:30px;box-shadow:0 10px 30px #0004;padding:18px 26px;text-align:center}
.hd{display:inline-block;font-size:28px;padding:6px 26px}
.ch{position:absolute;bottom:0;height:430px;pointer-events:none;animation:fl 3s ease-in-out infinite}
.ch.l{left:20px}.ch.r{right:20px;animation-delay:.6s}.ch.sm{height:200px;bottom:20px}.ch.xs{height:170px;bottom:10px}.ch.md{height:300px;bottom:70px}
@keyframes fl{50%{transform:translateY(-14px)}}
.big{position:absolute;left:310px;top:100px;width:660px;padding:26px}
.big h1{font-size:64px;line-height:1.1;color:#fff}.big b{color:#ffd93b;font-size:76px;display:block}.big p{font-size:30px;background:#0003;border-radius:14px;margin-top:8px}
.start{position:absolute;left:410px;bottom:90px;width:460px;font-size:40px;padding:22px 0}
.qn{font-size:24px;color:#a05a10;font-weight:800;margin-top:10px}
.q{font-size:38px;color:#4a2c10;margin:8px 0 14px}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.opt{display:flex;align-items:center;gap:14px;border:4px solid;border-radius:40px;padding:12px 18px;font-size:26px;font-weight:800;cursor:pointer;text-align:left;min-height:96px;transition:transform .15s}
.opt:hover:not(:disabled){transform:scale(1.03)}.opt b{flex:none;width:52px;height:52px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px}
.a0{background:#e3f8d8;border-color:#4cc23a;color:#1b6b12}.a0 b{background:#2fa81f}
.a1{background:#ffe0e3;border-color:#ee6a76;color:#a2202c}.a1 b{background:#d8303f}
.a2{background:#dff1ff;border-color:#5db4f2;color:#1b5a98}.a2 b{background:#2f86d8}
.a3{background:#efe2ff;border-color:#a77bf0;color:#5b2aa8}.a3 b{background:#7b43d6}
.opt.right{background:#7be063!important;color:#0b4a05;animation:pop .5s}.opt.bad{background:#ffb3ba!important;animation:shk .4s;opacity:.7}
.opt:disabled{cursor:default}
.fb{min-height:52px;font-size:30px;font-weight:800;margin:14px 0 6px;border-radius:20px;padding:4px 12px}
.fb.good{color:#17820e;background:#e3f8d8}.fb.bad{color:#b3202c;background:#ffe0e3;animation:shk .4s}
.nxt{position:absolute;right:26px;bottom:18px;font-size:28px}
@keyframes pop{50%{transform:scale(1.08)}}@keyframes shk{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.tabs{display:flex;justify-content:center;gap:12px;margin:8px 0}
.tab{padding:6px 22px;border-radius:20px;background:#f3dcae;font-size:22px;font-weight:800;color:#8a5520}.tab.on{background:#ff9a3c;color:#fff}
.ins{font-size:26px;color:#4a2c10;font-weight:700;margin:6px 0}
.pool{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-content:flex-start;padding:4px}.pool:empty{display:none}
.chip{background:#fff;border:4px solid #f0a53a;border-radius:20px;padding:8px 16px;font-size:22px;font-weight:800;color:#6b3d0e;cursor:grab;box-shadow:0 4px 0 #d9902b}
.chip.sel{background:#ffe9a8;transform:scale(1.07);border-color:#e8590c}.chip.ok{background:#e3f8d8;border-color:#4cc23a;color:#1b6b12;cursor:default;box-shadow:none;font-size:18px;padding:5px 10px;animation:pop .5s}
.cards{display:flex;gap:20px;justify-content:center}
.who{flex:1;background:#fff;border:5px dashed #f0b66a;border-radius:26px;padding:8px;cursor:pointer}
.who:hover{background:#fff4d6}.who h3{font-size:30px;color:#a2202c}.wi{height:80px}.got{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:4px}
.big2{font-size:38px;color:#4a2c10;font-weight:800;margin:28px 0}.yn{display:flex;gap:30px;justify-content:center}.yn .btn{font-size:36px;padding:20px 60px}
.row{display:flex;gap:14px;justify-content:center;margin-top:26px}
.ev{position:relative;width:200px;min-height:230px;background:#fff;border:5px solid #f0b66a;border-radius:24px;padding:48px 10px 10px;font-size:23px;font-weight:800;color:#4a2c10;cursor:pointer;box-shadow:0 6px 0 #d9902b}
.ev.sel{background:#ffe9a8;transform:translateY(-10px) scale(1.04);border-color:#e8590c}
.nb{position:absolute;top:-18px;left:50%;margin-left:-26px;width:52px;height:52px;border-radius:50%;color:#fff;font-style:normal;font-size:30px;display:flex;align-items:center;justify-content:center;border:4px solid #fff;box-shadow:0 3px 6px #0005}
.n0{background:#2a62d8}.n1{background:#f2800c}.n2{background:#d83030}.n3{background:#7b43d6}
.node{position:absolute;width:200px;text-align:center}.node button{width:110px;height:110px;border-radius:50%;border:6px solid #fff;font-size:52px;font-weight:800;color:#fff;cursor:pointer;box-shadow:0 8px 0 #0004}.node button:hover{transform:scale(1.08)}
.node .sign{font-size:20px;padding:6px 10px;margin-top:14px}.lock{background:#999!important}.dn{background:linear-gradient(#ffd93b,#ff9a00)!important}
#ov{position:absolute;inset:0;background:#000a;z-index:50;display:none;align-items:center;justify-content:center;flex-direction:column;gap:20px}
#ov.on{display:flex}#ov .sign{font-size:44px;padding:20px 50px}.stars{font-size:110px;display:flex;gap:10px}
.stars span{animation:st .8s both}.stars span:nth-child(2){animation-delay:.3s}.stars span:nth-child(3){animation-delay:.6s}
@keyframes st{from{transform:scale(0) rotate(-180deg);opacity:0}to{transform:scale(1);opacity:1}}
.fx{position:absolute;bottom:200px;font-size:44px;pointer-events:none;z-index:40;animation:fly 1.4s forwards}
@keyframes fly{to{transform:translateY(-340px) rotate(40deg);opacity:0}}
.trophy{font-size:120px;animation:pop 1.2s infinite}.rib{display:inline-block;background:linear-gradient(#ff5a5a,#c01f1f);color:#fff;font-size:54px;font-weight:800;padding:6px 60px;border-radius:14px;border:5px solid #fff;box-shadow:0 8px 16px #0005}
.res{position:absolute;left:290px;right:290px;top:80px;text-align:center}
.sc{background:#fff8e4;border:5px solid #f0b66a;border-radius:26px;margin-top:10px;padding:10px 16px;font-size:40px;font-weight:800;color:#4a2c10}
.sc p{font-size:25px;color:#a05a10;margin-top:6px}.mor{font-size:22px!important;color:#1b6b12!important;font-style:italic}
.rb{position:absolute;bottom:24px;left:0;right:0;display:flex;gap:24px;justify-content:center}
</style></head>

 <div id="bar"></div>
 <div id="scr"></div>
 <div id="ov"></div>
</div>

}
const mc=()=>Object.keys(S.m).length;
const done1=()=>QS.every((_,i)=>S.qd[i]);
const done2=()=>mc()==M.length&&J.every((_,i)=>S.jd[i]);
const done3=()=>S.o3;
const doneCount=()=>S.qd.filter(Boolean).length+mc()+S.jd.filter(Boolean).length+(S.o3?1:0);

/* ===== 3. ДЫБЫС ЖӘНЕ ЭФФЕКТ ===== */
function tone(f,t,d,type,v){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type||"sine";o.frequency.value=f;g.gain.setValueAtTime(v||.08,AC.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+t+d);o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+t);o.stop(AC.currentTime+t+d)}catch(e){}}
function snd(k){if(!soundOn)return;
 if(k=="ok"){tone(660,0,.15);tone(880,.12,.25)}
 else if(k=="bad"){tone(300,0,.2,"triangle",.06);tone(240,.15,.3,"triangle",.06)}
 else if(k=="star"){[523,659,784,1047].forEach((f,i)=>tone(f,i*.18,.3))}
 else tone(500,0,.08)}
function burst(e){const a=$("#app");for(let i=0;i<10;i++){const d=document.createElement("div");d.className="fx";d.textContent=e||["⭐","✨","🌟"][i%3];d.style.left=(200+Math.random()*880)+"px";d.style.animationDelay=(Math.random()*.4)+"s";a.appendChild(d);setTimeout(()=>d.remove(),2000)}}
function msg(t,c){const f=$("#fb");if(f){f.className="fb "+c;f.textContent=t}}
function fb(e){const s=document.createElement("div");s.className=e.className;s.textContent=e.dataset.e;s.style.cssText="font-size:100px;text-align:center";e.replaceWith(s)}
const im=(k,c)=>`<img class="${c}" src="${IMG[k]}" data-e="${k=="r"?"🐓":"🦜"}" onerror="fb(this)" alt="">`;
const bg=n=>`background-image:url(${IMG["b"+n]});background-color:#8fd36b`;
function toggleSound(){soundOn=!soundOn;upd();if(soundOn)snd("ok")}

/* ===== 4. ЭКРАНДАР ===== */
const V={};
V.home=()=>`<div class="scr" style="${bg(1)}">${im("r","ch l")}${im("p","ch r")}
 <div class="sign big"><h1>Әтеш пен <b>ТОТЫҚҰС</b></h1><p>Интерактивті ойын</p></div>
 <button class="btn o start" onclick="go('map')">▶ Ойынды бастау</button></div>`;
V.map=()=>{
 const un=[true,done1(),done1()&&done2()],dn=[done1(),done2(),done3()],pos=[[340,500],[640,360],[940,490]],col=["#2a62d8","#f2800c","#d83030"];
 const nodes=pos.map((p,i)=>`<div class="node" style="left:${p[0]-100}px;top:${p[1]-70}px"><button class="${!un[i]?"lock":dn[i]?"dn":""}" style="background:${col[i]}" onclick="openStage(${i+1})">${!un[i]?"🔒":dn[i]?"⭐":i+1}</button><div class="sign">${i+1}-кезең<br>${NAMES[i]}</div></div>`).join("");
 return `<div class="scr" style="${bg(2)}"><svg width="1280" height="720" style="position:absolute;inset:0;pointer-events:none"><path d="M340 500 C 450 640, 520 380, 640 360 S 850 620, 940 490" stroke="#b98a4a" stroke-width="54" fill="none" stroke-linecap="round"/><path d="M340 500 C 450 640, 520 380, 640 360 S 850 620, 940 490" stroke="#f1d9a0" stroke-width="40" fill="none" stroke-linecap="round" stroke-dasharray="2 40"/></svg>
 <div class="sign" style="position:absolute;left:440px;top:92px;width:400px;font-size:36px">Ертегі жолы</div>${nodes}
 ${im("r","ch l xs")}${im("p","ch r xs")}
 ${done1()&&done2()&&done3()?`<button class="btn o" style="position:absolute;left:470px;bottom:30px;font-size:30px;width:340px" onclick="go('res')">🏆 Қорытынды</button>`:""}</div>`};
V.s1=()=>{const i=S.q,Q=QS[i],d=S.qd[i];
 return `<div class="scr" style="${bg(1)}">${im("r","ch l sm")}${im("p","ch r sm")}<div class="panel"><div class="sign hd">1-кезең · ${NAMES[0]}</div>
 <div class="qn">${i+1} / ${QS.length} сұрақ</div><h2 class="q">${Q.q}</h2>
 <div class="ans">${Q.a.map((t,k)=>`<button class="opt a${k}${d&&k==Q.c?" right":""}" ${d?"disabled":""} onclick="ans(${k})"><b>${"ABCD"[k]}</b>${t}</button>`).join("")}</div>
 <div id="fb" class="fb ${d?"good":""}">${d?"Дұрыс! Жарайсың!":""}</div>
 <button id="nx" class="btn g nxt" ${d?"":"disabled"} onclick="nx1()">${i==QS.length-1?"Аяқтау ✓":"Келесі сұрақ ▶"}</button></div></div>`};
V.s2=()=>`<div class="scr" style="${bg(1)}">${im("r","ch l sm")}${im("p","ch r sm")}<div class="panel"><div class="sign hd">2-кезең · ${NAMES[1]}</div>
 <div class="tabs"><span class="tab ${S.t2==0?"on":""}">1. Кейіпкерді таны</span><span class="tab ${S.t2==1?"on":""}">2. Досыңның әрекетін бағала</span></div><div id="t2"></div></div></div>`;
V.s3=()=>`<div class="scr" style="${bg(1)}">${im("r","ch l sm")}${im("p","ch r sm")}<div class="panel"><div class="sign hd">3-кезең · ${NAMES[2]}</div>
 <p class="ins">Карточкаларды дұрыс ретке қой: екеуін ретімен таңда немесе сүйреп апар.</p>
 <div class="row">${S.ord.map((id,p)=>`<div class="ev ${S.sel===p?"sel":""}" draggable="${!S.o3}" ondragstart="dragId=${p}" ondragover="event.preventDefault()" ondrop="sw(dragId,${p})" onclick="sw(null,${p})"><i class="nb n${p}">${p+1}</i>${EV[id]}</div>`).join("")}</div>
 <div id="fb" class="fb ${S.o3?"good":""}" style="margin-top:22px">${S.o3?"Жарайсың! Сен оқиғаларды дұрыс реттедің!":""}</div>
 <button class="btn ${S.o3?"g":"o"} nxt" onclick="${S.o3?"go('res')":"chk()"}">${S.o3?"Қорытынды ▶":"Жауапты тексеру ✓"}</button></div></div>`;
V.res=()=>{const s=S.score,m=s>=90?"Тамаша! Сен ертегіні өте жақсы меңгердің!":s>=70?"Жарайсың! Сен жақсы орындадың!":s>=50?"Жақсы! Тағы бір рет қайталап көр!":"Уайымдама! Қайта ойнап, біліміңді шыңда!";
 return `<div class="scr" style="${bg(3)}">${im("r","ch l md")}${im("p","ch r md")}<div class="res"><div class="trophy">🏆</div><div class="stars" style="font-size:60px;justify-content:center"><span>⭐</span><span>⭐</span><span>⭐</span></div>
 <div class="rib">Жарайсың!</div><div class="sc">Сенің нәтижең: ${s} / 100<p>${m}</p><p class="mor">Нағыз дос — сеніміңді ақтайтын, уәдесінде тұрatын, адал адам.</p></div></div>
 <div class="rb"><button class="btn b" onclick="again()">⟳ Қайта ойнау</button><button class="btn pu" onclick="toHome()">🏠 Басты бет</button></div></div>`.replace("тұрatын","тұратын")};

/* ===== 5. НАВИГАЦИЯ ЖӘНЕ ЖАЛПЫ ФУНКЦИЯЛАР ===== */
function upd(){
 const home=S.cur=="home";
 $("#bar").innerHTML=`${home?"":`<button class="btn b" onclick="back()">◀ Кері</button><button class="btn pu" onclick="toHome(1)">🏠 Басты бет</button><span class="pill">⭐ ${S.score} / 100</span><div class="prog"><i style="width:${doneCount()/TOTAL*100}%"></i></div>`}${home?'<div style="flex:1"></div>':""}<button class="btn o" onclick="toggleSound()">${soundOn?"🔊 Дыбыс":"🔇 Дыбыс өшірулі"}</button>`;
}
function render(){$("#scr").innerHTML=V[S.cur]();upd();if(S.cur=="s2")drawT2()}
function go(n){S.cur=n;S.sel=null;$("#ov").className="";
 if(n=="s1"){const f=QS.findIndex((_,i)=>!S.qd[i]);S.q=f<0?0:f}
 if(n=="s2")S.t2=mc()==M.length?1:0;
 render();const e=$("#scr");e.style.opacity=0;e.style.transition="opacity .4s";requestAnimationFrame(()=>e.style.opacity=1);snd()}
function openStage(n){const un=[true,done1(),done1()&&done2()];
 if(!un[n-1]){snd("bad");burst("🔒");return}go("s"+n)}
function back(){go(S.cur=="map"?"home":"map")}
function toHome(keep){if(!keep)reset();go("home")}
function again(){reset();go("map")}
function stageDone(n){const o=$("#ov");
 o.innerHTML=`<div class="sign">${n}-кезең аяқталды!</div><div class="stars"><span>⭐</span><span>⭐</span><span>⭐</span></div>
 <button class="btn ${n==3?"o":"g"}" style="font-size:32px" onclick="go('${n==3?"res":"map"}')">${n==3?"🏆 Қорытындыны көру":"Картаға өту ▶"}</button>`;
 o.className="on";snd("star");burst()}

/* ===== 6. 1-КЕЗЕҢ ===== */
function ans(k){const Q=QS[S.q];if(S.qd[S.q])return;const bs=document.querySelectorAll(".opt");
 if(k==Q.c){S.qd[S.q]=true;S.score+=10;bs.forEach(b=>b.disabled=true);bs[k].classList.add("right");msg("Дұрыс! Жарайсың!","good");$("#nx").disabled=false;snd("ok");burst();upd()}
 else{bs[k].classList.add("bad");bs[k].disabled=true;msg("Тағы да ойланып көр!","bad");snd("bad")}}
function nx1(){if(S.q==QS.length-1)stageDone(1);else{S.q++;render()}}

/* ===== 7. 2-КЕЗЕҢ ===== */
function drawT2(){const c=$("#t2");if(!c)return;
 if(S.t2==0){
  const pool=M.map((x,i)=>S.m[i]?"":`<div class="chip ${S.sel===i?"sel":""}" draggable="true" ondragstart="dragId=${i}" onclick="pick(${i})">${x.t}</div>`).join("");
  const card=(w,n,k)=>`<div class="who" ondragover="event.preventDefault()" ondrop="place(dragId,'${w}')" onclick="place(S.sel,'${w}')">${im(k,"wi")}<h3>${n}</h3><div class="got">${M.map((x,i)=>S.m[i]&&x.w==w?`<span class="chip ok">${x.t}</span>`:"").join("")}</div></div>`;
  c.innerHTML=`<p class="ins">Сипаттаманы кейіпкерге апар (немесе сипаттаманы, сосын кейіпкерді бас).</p><div class="pool">${pool}</div><div class="cards">${card("e","Әтеш","r")}${card("p","Тотықұс","p")}</div>
  <div id="fb" class="fb ${mc()==M.length?"good":""}" style="margin:8px 300px 0 0">${mc()==M.length?"Жарайсың! Барлығы дұрыс!":""}</div>${mc()==M.length?`<button class="btn g nxt" onclick="S.t2=1;render()">Келесі тапсырма ▶</button>`:""}`;
 }else{
  const j=J.findIndex((_,i)=>!S.jd[i]);
  if(j<0){c.innerHTML=`<div class="big2">Барлық тұжырым бағаланды!</div><button class="btn g" style="font-size:30px" onclick="stageDone(2)">Аяқтау ✓</button>`;return}
  c.innerHTML=`<div class="qn">${j+1} / ${J.length} тұжырым</div><div class="big2">${J[j].t}</div>
  <div class="yn"><button class="btn g" onclick="ans2(true)">✔ Дұрыс</button><button class="btn rd" onclick="ans2(false)">✘ Бұрыс</button></div>
  <div id="fb" class="fb" style="margin-top:24px"></div><button id="nx2" class="btn g nxt" style="display:none" onclick="drawT2()">${j==J.length-1?"Аяқтау ✓":"Келесі ▶"}</button>`;
 }}
function pick(i){S.sel=S.sel===i?null:i;drawT2();snd()}
function place(i,w){if(i==null||i<0)return;dragId=null;const x=M[i];if(!x||S.m[i])return;
 if(x.w==w){S.m[i]=true;S.score+=3;S.sel=null;snd("ok");burst();upd();drawT2()}
 else{S.sel=null;drawT2();msg("Тағы да ойланып көр! Бұл сипаттама басқа кейіпкерге тиесілі.","bad");snd("bad")}}
function ans2(v){const j=J.findIndex((_,i)=>!S.jd[i]);if(j<0)return;const x=J[j];
 if(v===x.a){S.jd[j]=true;S.score+=3;msg(x.e,"good");$("#nx2").style.display="block";document.querySelectorAll(".yn .btn").forEach(b=>b.disabled=true);snd("ok");burst();upd();
  if(S.jd.filter(Boolean).length==J.length){$("#nx2").textContent="Аяқтау ✓";$("#nx2").onclick=()=>stageDone(2)}}
 else{msg("Тағы да ойланып көр! "+x.e,"bad");snd("bad")}}

/* ===== 8. 3-КЕЗЕҢ ===== */
function sw(a,b){if(S.o3)return;
 if(a==null||a<0){ /* басу арқылы */
  if(S.sel==null){S.sel=b;render();snd();return}
  a=S.sel}
 dragId=null;if(a!==b){const t=S.ord[a];S.ord[a]=S.ord[b];S.ord[b]=t;snd()}
 S.sel=null;render()}
function chk(){
 if(S.ord.every((id,p)=>id==p)){if(!S.o3){S.o3=true;S.score+=20}render();snd("ok");stageDone(3)}
 else{msg("Тағы бір рет ойланып көр. Ертегіде оқиғалар қалай болды?","bad");snd("bad")}}

/* ===== 9. МАСШТАБТАУ ЖӘНЕ ІСКЕ ҚОСУ ===== */
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);$("#app").style.transform=`translate(-50%,-50%) scale(${s})`}
addEventListener("resize",fit);fit();reset();go("home");
</script>
</body></html>
